# ZED Mini on the Jetson. The SDK computes depth from the HD720 grab locally.
# Only published image/depth data are scaled and rate limited for Wi-Fi preview.
/**:
  ros__parameters:
    general:
      grab_resolution: HD720
      grab_frame_rate: 30
      pub_resolution: CUSTOM
      pub_downscale_factor: 2.0
      pub_frame_rate: 10.0
    depth:
      depth_mode: NEURAL_LIGHT
      point_cloud_freq: 5.0
    pos_tracking:
      pos_tracking_enabled: false
    mapping:
      mapping_enabled: false
    object_detection:
      od_enabled: false
    debug:
      disable_nitros: true
