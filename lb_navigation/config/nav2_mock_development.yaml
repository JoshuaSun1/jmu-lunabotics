# MOCK ONLY: no physical use. Values are synthetic test settings, not robot calibration.
# Footprint/limits: robot_limits_development.yaml. Sensor range 8 m, 720 rays,
# hazard z=0.1 m and source timing are deterministic fixtures, not device specs.
# Rates/tolerances/checkers/retries are untuned mock policy; see docs/nav2_mock.md.
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ''
    topic_name: map
    frame_id: map
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      initial_transform_timeout: 10.0
      resolution: 0.05
      rolling_window: false
      track_unknown_space: false
      footprint: '[[0.55, 0.30], [0.55, -0.30], [-0.55, -0.30], [-0.55, 0.30]]'
      footprint_padding: 0.0
      plugins:
      - static_layer
      - obstacle_layer
      - hazard_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
        inflate_unknown: false
      always_send_full_costmap: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /sim/scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.2
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          min_obstacle_height: 0.0
          max_obstacle_height: 0.5
      hazard_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: hazards
        hazards:
          topic: /sim/hazards
          data_type: PointCloud2
          clearing: false
          marking: true
          observation_persistence: 0.0
          expected_update_rate: 0.2
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          min_obstacle_height: 0.0
          max_obstacle_height: 0.5
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.5
      initial_transform_timeout: 10.0
      width: 4
      height: 4
      resolution: 0.05
      rolling_window: true
      track_unknown_space: false
      footprint: '[[0.55, 0.30], [0.55, -0.30], [-0.55, -0.30], [-0.55, 0.30]]'
      footprint_padding: 0.0
      plugins:
      - static_layer
      - obstacle_layer
      - hazard_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
        inflate_unknown: false
      always_send_full_costmap: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /sim/scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.2
          obstacle_max_range: 8.0
          obstacle_min_range: 0.05
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          min_obstacle_height: 0.0
          max_obstacle_height: 0.5
      hazard_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: hazards
        hazards:
          topic: /sim/hazards
          data_type: PointCloud2
          clearing: false
          marking: true
          observation_persistence: 0.0
          expected_update_rate: 0.2
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          min_obstacle_height: 0.0
          max_obstacle_height: 0.5
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.1
      use_astar: false
      allow_unknown: false
controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    failure_tolerance: 0.0
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.1
      movement_time_allowance: 3.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.25
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: true
      allow_reversing: false
      max_angular_accel: 1.0
      rotate_to_heading_min_angle: 0.3
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    error_code_names: [compute_path_error_code, follow_path_error_code]
    bt_loop_duration: 10
    default_server_timeout: 100
    wait_for_service_timeout: 1000
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    cycle_frequency: 10.0
    behavior_plugins:
    - wait
    wait:
      plugin: nav2_behaviors::Wait
velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    feedback: OPEN_LOOP
    scale_velocities: false
    max_velocity:
    - 0.5
    - 0.0
    - 1.0
    min_velocity:
    - -0.5
    - 0.0
    - -1.0
    max_accel:
    - 0.5
    - 0.0
    - 1.0
    max_decel:
    - -0.5
    - 0.0
    - -1.0
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.25
    odom_topic: /odometry/local
    odom_duration: 0.1
lifecycle_manager_navigation:
  ros__parameters:
    autostart: false
    bond_timeout: 4.0
    attempt_respawn_reconnection: false
    node_names:
    - map_server
    - planner_server
    - controller_server
    - behavior_server
    - velocity_smoother
    - bt_navigator
