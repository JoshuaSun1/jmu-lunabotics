# N4 static-only costmaps for the AprilTag development profile.
# Physical robot use is prohibited: there is no live obstacle source, measured
# footprint, validated clearance, or continuous wheel/IMU localization.
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    topic_name: map
    frame_id: map

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.50
      initial_transform_timeout: 2.0
      resolution: 0.05
      rolling_window: false
      track_unknown_space: false
      footprint: "[[0.55, 0.30], [0.55, -0.30], [-0.55, -0.30], [-0.55, 0.30]]"
      footprint_padding: 0.0
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
        inflate_unknown: false
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.50
      initial_transform_timeout: 2.0
      width: 4.0
      height: 4.0
      resolution: 0.05
      rolling_window: true
      track_unknown_space: false
      footprint: "[[0.55, 0.30], [0.55, -0.30], [-0.55, -0.30], [-0.55, 0.30]]"
      footprint_padding: 0.0
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
        inflate_unknown: false
      always_send_full_costmap: true

lifecycle_manager_n4:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 4.0
    attempt_respawn_reconnection: false
    node_names:
      - map_server
      - global_costmap/global_costmap
      - local_costmap/local_costmap
